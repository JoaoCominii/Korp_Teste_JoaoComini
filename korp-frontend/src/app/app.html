<main class="main">
  <div class="app-layout" [class.sidebar-fechado]="!menuAberto">
    <!-- Sidebar -->
    <aside class="sidebar" [class.aberto]="menuAberto">
      <div class="sidebar-brand">
        <span class="brand-icon">K</span>
        <span class="brand-text" *ngIf="menuAberto">Korp Sistema</span>
      </div>
      <nav class="sidebar-nav">
        <a routerLink="/produtos" routerLinkActive="active" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8zm-2 4h4v2H8z"/>
          </svg>
          <span *ngIf="menuAberto">Produtos</span>
        </a>
        <a routerLink="/notas-fiscais" routerLinkActive="active" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          <span *ngIf="menuAberto">Notas Fiscais</span>
        </a>
        <a routerLink="/estoque" routerLinkActive="active" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8zm-2 4h4v2H8z"/>
          </svg>
          <span *ngIf="menuAberto">Estoque</span>
        </a>
      </nav>
      <div class="sidebar-footer" *ngIf="menuAberto">
        <span>v{{ versao }}</span>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" (click)="toggleMenu()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
          </button>
          <span class="page-title">Korp Sistema de NF</span>
        </div>
        <div class="topbar-right">
          <span class="usuario">{{ usuario }}</span>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area">
        <router-outlet></router-outlet>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-content">
          <span>Korp Sistema de NF - v{{ versao }}</span>
          <span>Desenvolvido para teste técnico</span>
        </div>
      </footer>
    </div>
  </div>
</main>
